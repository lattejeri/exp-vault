baseURL = 'https://lattejeri.github.io/exp-vault/'
languageCode = 'en-us'
title = 'EXP Vault'
theme = 'terminal'

[params]
  contentTypeName = 'posts'
  themeColor = 'orange'
  customCSS = ['css/terminal.css']
  showLanguageSelector = false
  fullWidthTheme = false
  centerTheme = false

[languages]
  [languages.en]
    title = "EXP Vault"
    subtitle = "Personal archive, notes, and projects."
    keywords = ""
    copyright = ""
    menuMore = "Show more"
    readMore = "Read more"
    readOtherPosts = "Read other posts"

    [languages.en.params.logo]
      logoText = "EXP Vault"
      logoHomeLink = "/"

    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "posts"
        name = "Posts"
        url = "/posts"
