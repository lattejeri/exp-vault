<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14120c" />
      <stop offset="100%" stop-color="#231f15" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#eec35e" stroke-width="0.5" stroke-opacity="0.12" />
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" />
  <rect width="800" height="500" fill="url(#grid)" />
  <circle cx="400" cy="250" r="160" fill="#eec35e" fill-opacity="0.04" />
  <rect x="120" y="90" width="560" height="320" rx="6" fill="#1a170f" stroke="#eec35e" stroke-width="1.5" stroke-opacity="0.6" />
  <!-- Terminal header bar -->
  <rect x="120" y="90" width="560" height="36" rx="6" fill="#252117" />
  <circle cx="146" cy="108" r="5" fill="#eec35e" fill-opacity="0.8" />
  <circle cx="164" cy="108" r="5" fill="#eec35e" fill-opacity="0.4" />
  <circle cx="182" cy="108" r="5" fill="#eec35e" fill-opacity="0.4" />
  <text x="400" y="113" fill="#eceae5" fill-opacity="0.6" font-family="monospace" font-size="13" text-anchor="middle">vault://entry/001</text>
  <!-- Content -->
  <text x="160" y="190" fill="#eec35e" font-family="monospace" font-size="28" font-weight="bold">> INITIAL_ENTRY</text>
  <text x="160" y="240" fill="#eceae5" fill-opacity="0.8" font-family="monospace" font-size="16">Personal archive &amp; digital garden</text>
  <text x="160" y="280" fill="#eceae5" fill-opacity="0.5" font-family="monospace" font-size="14">STATUS: ONLINE [v1.0.0]</text>
  <rect x="160" y="320" width="12" height="20" fill="#eec35e">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </rect>
</svg>
